[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "night-line"
version = "1.0.0"
description = "One public survival line per named lunar-night box, from the team's printed numbers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Stanislav Byriukov" }]
keywords = ["lunar night", "thermal", "battery", "survival line"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
night-line = "night_line.cli:main"

[tool.setuptools.packages.find]
include = ["night_line*"]
exclude = ["tests*", "out*", "sources*"]

[tool.setuptools.package-data]
night_line = ["py.typed", "boxes/*.json", "rides/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
